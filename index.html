<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b3a">
<link rel="manifest" href="manifest.json">
<title>PIXAI Prompt Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>PIXAI Prompt Manager</h1><p>プロンプトを保存・検索・コピー</p></header>
<main>
<section class="toolbar">
<input id="search" placeholder="プロンプトを検索">
<select id="categoryFilter"><option value="">すべてのカテゴリ</option></select>
<button id="addBtn">＋追加</button>
<button id="backupBtn">JSONバックアップ</button>
<label class="restore">JSON復元<input id="restoreInput" type="file" accept=".json"></label>
</section>
<section id="list"></section>
</main>
<script src="app.js"></script>
</body>
</html>
